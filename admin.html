<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — User Management</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #1e293b; min-height: 100vh; }

    .app-header {
      background: #1e3a5f; color: #fff;
      padding: 0.75rem 1.25rem;
      display: flex; align-items: center; gap: 0.75rem;
      position: sticky; top: 0; z-index: 100;
    }
    .app-header h1 { font-size: 1.1rem; flex: 1; }
    .badge { font-size: 0.65rem; font-weight: 700; padding: 0.2rem 0.45rem; border-radius: 4px; background: #fef3c7; color: #92400e; }
    .badge.staging { background: #dbeafe; color: #1e40af; }
    .badge.production { background: #dcfce7; color: #166534; }
    .header-btn { background: none; border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .header-btn:hover { background: rgba(255,255,255,0.1); }

    .main { padding: 1.25rem; max-width: 900px; margin: 0 auto; }

    .page-title { font-size: 1.3rem; font-weight: 700; color: #1e3a5f; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }

    .btn { padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background 0.15s; }
    .btn-primary { background: #1e3a5f; color: #fff; }
    .btn-primary:hover { background: #2d5a8e; }
    .btn-secondary { background: #e2e8f0; color: #1e293b; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: 0.3rem 0.65rem; font-size: 0.8rem; }

    .table-wrap { background: #fff; border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: #f8fafc; font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.7rem 1rem; text-align: left; border-bottom: 1px solid #e2e8f0; }
    tbody td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    .td-actions { display: flex; gap: 0.4rem; }
    .td-date { color: #64748b; font-size: 0.82rem; }

    .role-badge { font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; }
    .role-badge.ADMIN { background: #f3e8ff; color: #6b21a8; }
    .role-badge.USER { background: #dbeafe; color: #1e40af; }

    .status-wrap { display: flex; align-items: center; gap: 0.4rem; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.active { background: #22c55e; }
    .status-dot.inactive { background: #94a3b8; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; font-size: 0.95rem; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 1.75rem; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .modal h3 { font-size: 1.1rem; margin-bottom: 1rem; color: #1e3a5f; }
    .form-row { margin-bottom: 0.85rem; }
    .form-row label { display: block; font-size: 0.82rem; font-weight: 600; color: #374151; margin-bottom: 0.3rem; }
    .form-row input, .form-row select { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.9rem; outline: none; background: #fff; }
    .form-row input:focus, .form-row select:focus { border-color: #3b82f6; }
    .form-row-check { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.85rem; }
    .form-row-check input[type="checkbox"] { width: 1rem; height: 1rem; accent-color: #2563eb; cursor: pointer; }
    .form-row-check label { font-size: 0.88rem; color: #374151; cursor: pointer; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.25rem; }
    .modal-error { color: #b91c1c; font-size: 0.82rem; margin-top: 0.5rem; min-height: 1.2rem; }

    .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; display: none; align-items: center; justify-content: center; }
    .confirm-overlay.open { display: flex; }
    .confirm-box { background: #fff; border-radius: 12px; padding: 1.5rem; max-width: 340px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .confirm-box p { margin-bottom: 1.25rem; color: #374151; }
    .confirm-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }

    .toast { position: fixed; bottom: 1.25rem; right: 1.25rem; background: #1e293b; color: #fff; padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.875rem; z-index: 500; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.error { background: #b91c1c; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>Admin — User Management</h1>
    <span id="envBadge" class="badge">LOCAL</span>
    <button class="header-btn" onclick="window.location.href='planner.html'">Planner</button>
    <button class="header-btn" id="logoutBtn">Logout</button>
  </header>

  <main class="main">
    <div class="page-title">
      Users
      <button class="btn btn-primary btn-sm" onclick="showCreateModal()">+ New User</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Status</th>
            <th>Created</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <tr><td colspan="5" class="empty-state">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Create User Modal -->
  <div id="createModal" class="modal-overlay">
    <div class="modal">
      <h3>New User</h3>
      <div class="form-row">
        <label>Username</label>
        <input type="text" id="createLoginID" placeholder="e.g. Jane_D" autocomplete="off" />
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" id="createPassword" autocomplete="new-password" />
      </div>
      <div class="form-row">
        <label>Role</label>
        <select id="createRole">
          <option value="USER">USER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </div>
      <div class="modal-error" id="createError"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitCreateUser()">Create</button>
      </div>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div id="editModal" class="modal-overlay">
    <div class="modal">
      <h3 id="editModalTitle">Edit User</h3>
      <div class="form-row">
        <label>Role</label>
        <select id="editRole">
          <option value="USER">USER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </div>
      <div class="form-row-check">
        <input type="checkbox" id="editActive" />
        <label for="editActive">Active</label>
      </div>
      <div class="modal-error" id="editError"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitEditUser()">Save</button>
      </div>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div id="passwordModal" class="modal-overlay">
    <div class="modal">
      <h3 id="passwordModalTitle">Reset Password</h3>
      <div class="form-row">
        <label>New Password</label>
        <input type="password" id="newPassword" autocomplete="new-password" />
      </div>
      <div class="modal-error" id="passwordError"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closePasswordModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitResetPassword()">Update</button>
      </div>
    </div>
  </div>

  <!-- Confirm Delete -->
  <div id="confirmOverlay" class="confirm-overlay">
    <div class="confirm-box">
      <p id="confirmMsg"></p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger" onclick="doDelete()">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./config.js"></script>
  <script src="./apiClient.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
